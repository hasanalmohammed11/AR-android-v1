plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.arline'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.arline"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.ar:core:1.42.0'
}
